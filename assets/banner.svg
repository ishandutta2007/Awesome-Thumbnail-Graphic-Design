<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#1a1f36" />
    </linearGradient>

    <!-- Animated Accent Gradients -->
    <linearGradient id="glowViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#8b5cf6;#ec4899;#3b82f6;#8b5cf6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#ec4899;#3b82f6" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="glowAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.7">
        <animate attributeName="stop-color" values="#f59e0b;#ef4444;#10b981;#f59e0b" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f3f4f6" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Animated Glowing Aura Orbs (Background layer) -->
  <circle cx="150" cy="90" r="140" fill="url(#glowViolet)" filter="url(#blurFilter)">
    <animate attributeName="cy" values="90;130;90" dur="6s" repeatCount="indefinite" />
    <animate attributeName="r" values="140;170;140" dur="6s" repeatCount="indefinite" />
  </circle>

  <circle cx="1060" cy="310" r="150" fill="url(#glowAmber)" filter="url(#blurFilter)">
    <animate attributeName="cx" values="1060;1020;1060" dur="8s" repeatCount="indefinite" />
    <animate attributeName="r" values="150;180;150" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic Design Workflow Elements (Right Side / Background) -->
  <!-- Floating Thumbnail Canvas 16:9 Mockup -->
  <g transform="translate(860, 60)" opacity="0.85">
    <rect x="0" y="0" width="280" height="158" rx="12" fill="#1e2638" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="5s" repeatCount="indefinite" />
    </rect>
    <!-- Video Canvas Elements -->
    <rect x="16" y="16" width="130" height="14" rx="4" fill="#38bdf8" fill-opacity="0.7" />
    <rect x="16" y="38" width="90" height="10" rx="3" fill="#94a3b8" fill-opacity="0.5" />
    <!-- CTR Badge on Mockup -->
    <rect x="190" y="14" width="74" height="24" rx="6" fill="#ef4444" fill-opacity="0.9" />
    <text x="227" y="30" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="700" text-anchor="middle">🔥 +45% CTR</text>
    <!-- Play Icon Circle -->
    <circle cx="140" cy="95" r="24" fill="#6366f1" fill-opacity="0.8">
      <animate attributeName="r" values="24;27;24" dur="2s" repeatCount="indefinite" />
    </circle>
    <polygon points="135,87 150,95 135,103" fill="#ffffff" />
    <!-- 16:9 Aspect Pill -->
    <rect x="16" y="126" width="60" height="18" rx="4" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" />
    <text x="46" y="139" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="600" text-anchor="middle">1280×720</text>
    <!-- 4K Resolution Pill -->
    <rect x="82" y="126" width="46" height="18" rx="4" fill="#0f172a" fill-opacity="0.8" stroke="#a855f7" stroke-width="1" />
    <text x="105" y="139" fill="#c084fc" font-family="monospace" font-size="9" font-weight="600" text-anchor="middle">HD/4K</text>
  </g>

  <!-- Floating Vector Layers Card (Right Lower) -->
  <g transform="translate(890, 246)" opacity="0.8">
    <rect x="0" y="0" width="240" height="110" rx="10" fill="#131b2e" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1.5">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,5; 0,0" dur="4.5s" repeatCount="indefinite" />
    </rect>
    <!-- Layers List Mockup -->
    <g transform="translate(14, 16)">
      <rect x="0" y="0" width="16" height="16" rx="3" fill="#a855f7" fill-opacity="0.8" />
      <text x="26" y="13" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="500">AI Background Inpainting</text>
    </g>
    <g transform="translate(14, 46)">
      <rect x="0" y="0" width="16" height="16" rx="3" fill="#38bdf8" fill-opacity="0.8" />
      <text x="26" y="13" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="500">Vector Cutout &amp; Stroke</text>
    </g>
    <g transform="translate(14, 76)">
      <rect x="0" y="0" width="16" height="16" rx="3" fill="#f59e0b" fill-opacity="0.8" />
      <text x="26" y="13" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="500">High-Contrast Typography</text>
    </g>
  </g>

  <!-- FOREGROUND LAYER: Text and Main Information (Guaranteed top stacking) -->
  <g transform="translate(60, 0)">
    <!-- Header Top Badge -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="310" height="30" rx="15" fill="url(#badgeGrad)" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="16" cy="15" r="5" fill="#34d399">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="20" fill="#93c5fd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM • 2026 EDITION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" fill="url(#textGrad)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#softGlow)">
      Awesome Thumbnail
    </text>
    <text x="0" y="190" fill="url(#textGrad)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      &amp; Graphic Design
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="235" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="400" letter-spacing="0.2">
      Top SaaS Platforms, Open-Source Software &amp; AI Engines for Visual Content
    </text>

    <text x="0" y="260" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400">
      Built for YouTube creators, graphic designers, marketers, and full-stack developers
    </text>

    <!-- Interactive / Feature Badges Strip (Foreground) -->
    <g transform="translate(0, 305)">
      <!-- Pill 1: SaaS Leaders -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="1.2" />
        <text x="14" y="22" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="600">💎 SaaS Leaders</text>
      </g>

      <!-- Pill 2: Open-Source Suites -->
      <g transform="translate(172, 0)">
        <rect x="0" y="0" width="180" height="36" rx="8" fill="#1e293b" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.2" />
        <text x="14" y="22" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="600">⚡ Open-Source Suites</text>
      </g>

      <!-- Pill 3: AI & Inpainting -->
      <g transform="translate(364, 0)">
        <rect x="0" y="0" width="175" height="36" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-opacity="0.6" stroke-width="1.2" />
        <text x="14" y="22" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="600">🤖 AI &amp; Inpainting</text>
      </g>

      <!-- Pill 4: Canvas & Automation SDKs -->
      <g transform="translate(551, 0)">
        <rect x="0" y="0" width="195" height="36" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.2" />
        <text x="14" y="22" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="600">🚀 Automated Pipelines</text>
      </g>
    </g>
  </g>
</svg>
